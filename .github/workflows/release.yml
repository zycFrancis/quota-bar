name: Build signed macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish 步骤用 git rev-parse 校验 tag 是否存在；浅克隆不带 tag ref
          # 会导致重复推 tag 被拒。全量克隆（仓库很小）让 tag refs 齐全。
          # 注意不能用 fetch-tags: true —— tag 事件触发的 checkout 会与之冲突。
          fetch-depth: 0

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$app_version" = "$GITHUB_REF_NAME"

      - name: Test
        run: swift test

      - name: Detect signing and notarization secrets
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CERTIFICATE_P12" ]] &&
             [[ -n "$CERTIFICATE_PASSWORD" ]] &&
             [[ -n "$NOTARY_APPLE_ID" ]] &&
             [[ -n "$NOTARY_PASSWORD" ]] &&
             [[ -n "$NOTARY_TEAM_ID" ]]; then
            echo "QUOTABAR_SIGNED_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "QUOTABAR_SIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "::warning::Publishing an ad-hoc signed, unnotarized macOS release."
          fi

      - name: Import Developer ID certificate
        if: env.QUOTABAR_SIGNED_RELEASE == '1'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/quotabar-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, notarize, and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/package-release.sh

      - name: Upload build artifact
        # release 发布步骤偶发静默失败；artifact 兜底保证产物总能取回。
        uses: actions/upload-artifact@v4
        with:
          name: quotabar-release
          path: dist/release/**
          if-no-files-found: error

      - name: Verify Gatekeeper acceptance
        if: env.QUOTABAR_SIGNED_RELEASE == '1'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          xcrun stapler validate "dist/Quota Bar.app"
          xcrun stapler validate "dist/release/v$version/Quota-Bar-$version.dmg"
          spctl --assess --type execute --verbose=2 "dist/Quota Bar.app"

      - name: Publish GitHub release
        # 仅 tag 触发时发布；workflow_dispatch（分支验证构建）只出 artifact。
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          tag="v$version"
          notes_file="RELEASE_NOTES_$version.md"
          test -f "$notes_file"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            "dist/release/$tag/Quota-Bar-$version.dmg" \
            "dist/release/$tag/Quota-Bar-$version.zip" \
            "dist/release/$tag/SHA256SUMS.txt" \
            --title "Quota Bar $tag" \
            --notes-file "$notes_file"
